appId: com.sajjadsami.kawaderhr
productName: كوادر HR

directories:
  output: dist

files:
  - "**/*"
  - "!dist/**"

win:
  target:
    - nsis

artifactName: "Kawader-HR-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
