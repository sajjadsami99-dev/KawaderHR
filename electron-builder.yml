name: Build Kawader HR

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run dist:win

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kawader-HR-Windows
          path: dist/*
